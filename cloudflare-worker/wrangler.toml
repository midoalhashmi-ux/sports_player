name = "binsheikh-api"
main = "src/index.js"
compatibility_date = "2024-11-01"

# مزامنة تلقائية كل ساعة — نفس دور syncMatchesHourly سابقاً.
# اليوم الحالي يُحدَّث بكل تشغيل (كل ساعة)، والأيام الأخرى ضمن نافذة
# -3..+3 تُحدَّث مرة واحدة فقط يومياً عند الساعة 0 UTC — راجع
# runScheduledSync في src/index.js للتفاصيل.
[triggers]
crons = ["0 * * * *"]

# متغيرات غير سرّية (اسم المشروع ثابت ومعروف، لا داعي لإخفائه).
[vars]
FIREBASE_PROJECT_ID = "sports-stream-app-36a7a"

# الأسرار التالية تُضبط بأمر "wrangler secret put" وليس هنا:
#   API_FOOTBALL_KEY
#   GCP_SERVICE_ACCOUNT_EMAIL
#   GCP_SERVICE_ACCOUNT_PRIVATE_KEY
#   ADMIN_SYNC_SECRET
#   HLS_TOKEN_SECRET   (جديد — لتوقيع/التحقق من روابط بث HLS الموقّتة)
# راجع README.md بنفس هذا المجلد للخطوات كاملة.
