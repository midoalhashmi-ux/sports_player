plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

android {
    namespace "com.midoalhashmi.zoltrastream"
    // Google Play requires API level 36 for new app releases.
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        applicationId "com.midoalhashmi.zoltrastream"
        minSdk 21
        // Required by Google Play: target API level 36.
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        // نحصر مكتبات التشغيل الأصلية (libmpv) على المعماريتين الحقيقيتين
        // لأجهزة أندرويد الفعلية فقط — هذا وحده يقلّل الحجم بشكل كبير جداً
        // لأن x86/x86_64 غير مستخدمة إلا في المحاكيات.
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    signingConfigs {
        release {
            // CI=true مضبوط تلقائياً من Codemagic — يقرأ الكيستور اللي ترفعه
            // في Code signing identities عبر android_signing بـ codemagic.yaml
            if (System.getenv()["CI"]) {
                storeFile file(System.getenv()["CM_KEYSTORE_PATH"])
                storePassword System.getenv()["CM_KEYSTORE_PASSWORD"]
                keyAlias System.getenv()["CM_KEY_ALIAS"]
                keyPassword System.getenv()["CM_KEY_PASSWORD"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}

flutter {
    source "../.."
}
