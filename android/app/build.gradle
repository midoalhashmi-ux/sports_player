plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

android {
    namespace "com.midoalhashmi.zoltrastream"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        applicationId "com.midoalhashmi.zoltrastream"
        minSdk 21
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        // نحصر مكتبات التشغيل الأصلية (libmpv) على المعماريتين الحقيقيتين
        // لأجهزة أندرويد الفعلية فقط (x86/x86_64 غير مستخدمة إلا بالمحاكيات)
        // — هذا كان مضبوطاً هنا بثبات بـ ndk.abiFilters، لكنه يتعارض مباشرة
        // مع "flutter build ... --split-per-abi" (يضبط splits.abi.filters
        // بنفس المعماريتين، وAGP يرفض وجود الاثنين معاً: "Conflicting
        // configuration"). التقييد الآن يتم فقط عبر علم "--target-platform
        // android-arm,android-arm64" وقت البناء (بالمحلي وبـ Codemagic
        // كلاهما) بدل تثبيته هنا — نفس الأثر بدون التعارض.
    }

    signingConfigs {
        release {
            // CI=true مضبوط تلقائياً من Codemagic — يقرأ الكيستور اللي ترفعه
            // في Code signing identities عبر android_signing بـ codemagic.yaml
            if (System.getenv()["CI"]) {
                storeFile file(System.getenv()["CM_KEYSTORE_PATH"])
                storePassword System.getenv()["CM_KEYSTORE_PASSWORD"]
                keyAlias System.getenv()["CM_KEY_ALIAS"]
                keyPassword System.getenv()["CM_KEY_PASSWORD"]
            }
            // بدون CI (بناء محلي على جهاز المطوّر)، ما فيه كيستور إنتاج
            // حقيقي متاح أصلاً — بدون هذا الفرع، الحزمة كانت تفشل بخطأ
            // توقيع لأن signingConfigs.release يبقى فارغاً بالكامل محلياً.
            // نوقّع بمفتاح debug القياسي بدلاً (نفسه المستخدم لأي مشروع
            // Flutter افتراضياً) — يبقى قابلاً للتثبيت والاختبار محلياً مع
            // كل فوائد نوع release (تصغير+ضغط الموارد)، فقط غير موقّع
            // بمفتاح الإنتاج الحقيقي؛ لا يصلح للنشر بمتجر التطبيقات هكذا.
            // نفس المسار الافتراضي القياسي اللي يولّده SDK أندرويد تلقائياً
            // (أول أي بناء debug على أي جهاز) — لا نُنشئ ولا نُرفق كيستور
            // خاص بالمستودع، فقط نشير لنفس الملف الجاهز أصلاً على الجهاز.
            else {
                storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}

flutter {
    source "../.."
}
