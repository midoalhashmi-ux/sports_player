plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

// كيستور محلي حقيقي (اختياري) للبناء على جهاز مطوّر بدون CI — أنشئه مرة
// واحدة بـkeytool ثم اكتب مساره هنا بدل الاعتماد على مفتاح debug
// المشترك. راجع android/key.properties.example للتعليمات؛ الملف نفسه
// (key.properties) بـ.gitignore عمداً، لا يُرفع أبداً لأنه يحتوي كلمات مرور.
def localKeyPropertiesFile = rootProject.file("key.properties")
def localKeyProperties = new Properties()
if (localKeyPropertiesFile.exists()) {
    localKeyPropertiesFile.withReader("UTF-8") { reader ->
        localKeyProperties.load(reader)
    }
}

android {
    namespace "com.midoalhashmi.zoltrastream"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        applicationId "com.midoalhashmi.zoltrastream"
        minSdk 21
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            // CI=true مضبوط تلقائياً من Codemagic — يقرأ الكيستور اللي ترفعه
            // في Code signing identities عبر android_signing بـ codemagic.yaml
            if (System.getenv()["CI"]) {
                storeFile file(System.getenv()["CM_KEYSTORE_PATH"])
                storePassword System.getenv()["CM_KEYSTORE_PASSWORD"]
                keyAlias System.getenv()["CM_KEY_ALIAS"]
                keyPassword System.getenv()["CM_KEY_PASSWORD"]
            }
        }
        // بناء محلي حقيقي (بلا CI) لما يوجد android/key.properties — راجع
        // key.properties.example. توقيع حقيقي ثابت (نفس المفتاح كل مرة)
        // بدل مفتاح debug العشوائي المشترك بين كل تثبيت Flutter — يمنع أي
        // تعارض/رسالة تحذير عند إعادة تثبيت التطبيق فوق نسخة قديمة (مؤكَّد
        // بمحاولة فعلية: رسالة "غير متوافق" من MIUI استمرت حتى بعد الحذف
        // الكامل لنسخة debug سابقة).
        localRelease {
            if (localKeyPropertiesFile.exists()) {
                // rootProject (لا project) عمداً — الكيستور بجانب key.properties
                // بمجلد android/ نفسه (حسب key.properties.example)، لا بـandroid/app/.
                storeFile rootProject.file(localKeyProperties["storeFile"])
                storePassword localKeyProperties["storePassword"]
                keyAlias localKeyProperties["keyAlias"]
                keyPassword localKeyProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            // ثلاث حالات: CI حقيقي (Codemagic) ← كيستور محلي حقيقي إن وُجد
            // (android/key.properties) ← مفتاح debug المؤقت كملاذ أخير فقط.
            if (System.getenv()["CI"]) {
                signingConfig signingConfigs.release
            } else if (localKeyPropertiesFile.exists()) {
                signingConfig signingConfigs.localRelease
            } else {
                signingConfig signingConfigs.debug
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}

flutter {
    source "../.."
}
