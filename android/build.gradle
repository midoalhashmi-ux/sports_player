buildscript {
    repositories {
        google()
        mavenCentral()
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

plugins {
    id 'com.android.application' version '9.0.1' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.20' apply false
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
