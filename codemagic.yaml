workflows:
  android-workflow:
    name: بناء أندرويد - تطبيق المشغل
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: جلب الحزم
        script: flutter pub get
      - name: بناء APK
        script: flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
