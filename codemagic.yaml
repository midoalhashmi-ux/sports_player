workflows:
  android-workflow:
    name: بناء أندرويد - تطبيق المشغل
    max_build_duration: 90
    environment:
      flutter: 3.27.0
    scripts:
      - name: جلب الحزم
        script: flutter pub get
      - name: بناء APK منفصل لكل معمارية (لتصغير الحجم)
        script: flutter build apk --release
      # ملاحظة: عند النشر النهائي على Google Play استخدم بدل هذا السطر:
      # flutter build appbundle --release
      # لأن جوجل حينها ترسل تلقائياً لكل جهاز فقط الحجم المناسب له.
    artifacts:
      - build/**/outputs/**/*.apk
