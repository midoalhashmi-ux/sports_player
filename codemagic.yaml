workflows:
  android-workflow:
    name: بناء أندرويد - تطبيق المشغل
    max_build_duration: 90
    environment:
      flutter: 3.27.0
      android_signing:
        - sports_player_release
    scripts:
      - name: جلب الحزم
        script: flutter pub get
      - name: طباعة بصمة SHA-1 (مؤقت - يُحذف بعد الاستخدام)
        script: |
          keytool -list -v \
            -keystore "$CM_KEYSTORE_PATH" \
            -storepass "$CM_KEYSTORE_PASSWORD" \
            -alias "$CM_KEY_ALIAS"
      - name: بناء APK منفصل لكل معمارية (لتصغير الحجم)
        script: flutter build apk --release
      # ملاحظة: عند النشر النهائي على Google Play استخدم بدل هذا السطر:
      # flutter build appbundle --release
      # لأن جوجل حينها ترسل تلقائياً لكل جهاز فقط الحجم المناسب له.
    artifacts:
      - build/**/outputs/**/*.apk
