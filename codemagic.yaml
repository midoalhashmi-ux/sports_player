workflows:
  android-workflow:
    name: BinSheikh player
    max_build_duration: 90
    environment:
      flutter: 3.27.0
      android_signing:
        - sports_player_release
    scripts:
      - name: جلب الحزم
        script: flutter pub get
      - name: بناء AAB (لرفعه على Google Play)
        script: flutter build appbundle --release
    artifacts:
      - build/**/outputs/**/*.aab
