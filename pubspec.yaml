name: sports_player
description: BinSheikh player
publish_to: 'none'
version: 1.0.6+7

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # خط Tajawal الاحترافي للهوية البصرية الموحّدة (راجع lib/theme/app_theme.dart)
  # 6.3.0 يفشل ببناء حقيقي: خطأ Dart compile ("does not have a primitive
  # operator ==") بخريطة const داخلية بالمكتبة نفسها — مُصلَح بإصدارات
  # أحدث؛ نفس واجهة tajawalTextTheme المستخدمة هنا (تحقّق من مصدر 8.2.1).
  google_fonts: ^8.2.1

  firebase_core: ^2.32.0
  cloud_firestore: ^4.15.5
  app_links: ^6.3.2

  # محرك تشغيل يدعم HLS وMP4/التقدمي (Android عبر ExoPlayer) بحجم صغير —
  # لا يدعم DASH/RTMP/MKV فعلياً رغم ما كان مكتوباً سابقاً (التطبيق أندرويد
  # فقط حالياً وكل القنوات المحمية تُقدَّم HLS، فما فيه أثر عملي)
  video_player: ^2.9.2

  # طلبات HTTP بسيطة تُستخدم في خدمة مصادقة البث (StreamAuthService)
  http: ^1.2.2

  # إبقاء الشاشة مضاءة أثناء المشاهدة
  wakelock_plus: ^1.2.8

  # حفظ الروابط المضافة يدوياً على الجهاز (شاشة "Add URL")
  shared_preferences: ^2.3.2

  # حفظ لقطات الشاشة في المعرض
  path_provider: ^2.1.4
  # 3.0.5 يفشل بخطأ Kotlin compile مع Gradle/Kotlin الحديثين (مؤكَّد من
  # محاولة بناء فعلية) — 4.0.1 يستخدم Kotlin/AGP أحدث بكوده الأندرويدي
  # نفسه، بنفس واجهة Dart تماماً (saveImage/saveFile) فلا تغيير بالاستخدام.
  image_gallery_saver_plus: ^4.0.1

  # إعلانات AdMob (بيني + بانر)
  google_mobile_ads: ^5.2.0

  # مشاركة التطبيق عبر قوائم مشاركة النظام
  share_plus: ^10.0.2

  # فتح متجر Google Play وروابط خارجية من صفحة "اتصل بنا"
  url_launcher: ^6.3.1

  # عرض صفحات البث الرسمية داخل شاشة المشاهدة عند استخدام streamType=web
  webview_flutter: ^4.10.0

  # قراءة رقم إصدار التطبيق المثبَّت فعلياً على الجهاز، تُستخدم في
  # VersionCheckService لمقارنته بـ minVersion من لوحة التحكم (شاشة
  # التحديث الإجباري)
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
